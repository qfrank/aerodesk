[package]
name = "aerodesk"
version = "0.1.2"
edition = "2021"
description = "AeroDesk — desktop companion; pastes phone-polished text at the cursor (clipboard-free)"
license = "MIT"

[lib]
name = "aerodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
local-ip-address = "0.6"
hostname = "0.4"
dirs = "5"
qrcode = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# enigo is only used for clipboard-free Unicode injection on macOS/Windows.
# Linux uses xdotool/wtype (see platform/linux.rs); enigo is not pulled on Linux.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking"] }

[workspace]
members = ["xtask"]
